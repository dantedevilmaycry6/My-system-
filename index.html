<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SYSTEM - Monarch Path</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYSTEM">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">

<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Rajdhani', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    overscroll-behavior: none;
  }

  body {
    background: #000000;
    color: #d4d4e8;
    overflow-x: hidden;
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 15% 10%, rgba(138, 43, 226, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(212, 175, 55, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(75, 0, 130, 0.06) 0%, transparent 60%);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: #d4af37;
    border-radius: 50%;
    animation: float 18s infinite linear;
    opacity: 0.5;
    box-shadow: 0 0 4px #d4af37;
  }

  @keyframes float {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.7; }
    100% { transform: translateY(-10vh) translateX(80px); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  .system-header {
    text-align: center;
    padding: 40px 0 20px;
  }

  .system-title {
    font-family: 'Cinzel', serif;
    font-size: 2.6em;
    font-weight: 900;
    background: linear-gradient(135deg, #d4af37 0%, #fff6d9 50%, #d4af37 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
    text-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
    letter-spacing: 4px;
  }

  @keyframes shine {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .subtitle {
    color: #7a6a9e;
    font-size: 0.85em;
    margin-top: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .divider {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
    margin: 20px auto;
  }

  .player-card {
    background: linear-gradient(145deg, rgba(15, 10, 25, 0.95), rgba(25, 15, 40, 0.95));
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 4px;
    padding: 30px;
    margin: 20px 0;
    box-shadow: 
      0 0 50px rgba(138, 43, 226, 0.15),
      inset 0 0 30px rgba(0,0,0,0.5);
    position: relative;
  }

  .player-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
  }

  .player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 15px;
  }

  .player-name-section {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .player-avatar {
    width: 65px; height: 65px;
    border-radius: 4px;
    background: linear-gradient(145deg, #1a1030, #2d1a4e);
    border: 1px solid #d4af37;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8em;
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    cursor: pointer;
  }

  .player-avatar:active { transform: scale(0.95); }

  .player-info h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.3em;
    color: #fff;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .player-rank {
    display: inline-block;
    padding: 4px 16px;
    background: transparent;
    border: 1px solid;
    border-radius: 2px;
    font-weight: 700;
    font-size: 0.75em;
    letter-spacing: 2px;
  }

  .level-display { text-align: right; }

  .level-number {
    font-family: 'Cinzel', serif;
    font-size: 2.2em;
    font-weight: 900;
    color: #d4af37;
    text-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
  }

  .level-label {
    color: #7a6a9e;
    font-size: 0.75em;
    letter-spacing: 3px;
    font-weight: 600;
  }

  .exp-container { margin: 18px 0; }

  .exp-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 0.8em;
    color: #8a7aae;
    letter-spacing: 1px;
  }

  .exp-bar-bg {
    width: 100%;
    height: 14px;
    background: rgba(0,0,0,0.6);
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid rgba(212, 175, 55, 0.2);
  }

  .exp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6b2fbf, #d4af37);
    transition: width 0.5s ease;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
    position: relative;
    overflow: hidden;
  }

  .exp-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shimmer 2.5s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-top: 22px;
  }

  .stat-box {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(138, 43, 226, 0.25);
    border-radius: 4px;
    padding: 14px;
    text-align: center;
    transition: all 0.3s;
  }

  .stat-box:active {
    border-color: #d4af37;
  }

  .stat-icon { font-size: 1.6em; margin-bottom: 6px; }

  .stat-name {
    font-size: 0.68em;
    color: #8a7aae;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }

  .stat-value {
    font-family: 'Cinzel', serif;
    font-size: 1.6em;
    font-weight: 700;
    color: #fff;
    margin: 6px 0;
  }

  .stat-points-btn {
    background: linear-gradient(145deg, #d4af37, #a8841f);
    color: #000;
    border: none;
    border-radius: 3px;
    width: 28px; height: 28px;
    cursor: pointer;
    font-weight: 900;
    font-size: 1.1em;
  }

  .stat-points-btn:active { transform: scale(0.9); }

  .free-points {
    text-align: center;
    margin-top: 12px;
    color: #d4af37;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 0.9em;
  }

  .nav-tabs {
    display: flex;
    gap: 8px;
    margin: 25px 0;
    flex-wrap: wrap;
  }

  .nav-tab {
    padding: 13px 20px;
    background: rgba(15, 10, 25, 0.8);
    border: 1px solid rgba(138, 43, 226, 0.25);
    border-radius: 4px;
    color: #8a7aae;
    cursor: pointer;
    font-weight: 600;
    flex: 1;
    min-width: 100px;
    text-align: center;
    user-select: none;
    font-size: 0.9em;
    letter-spacing: 0.5px;
  }

  .nav-tab.active {
    background: linear-gradient(145deg, #2d1a4e, #1a1030);
    border-color: #d4af37;
    color: #d4af37;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
  }

  .tab-content { display: none; animation: fadeIn 0.4s; }
  .tab-content.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 1.3em;
    color: #d4af37;
    margin-bottom: 20px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Библиотека квестов */
  .library-btn {
    background: linear-gradient(145deg, #2d1a4e, #1a1030);
    border: 1px solid #d4af37;
    color: #d4af37;
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 0.75em;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .library-category {
    margin-bottom: 25px;
  }

  .library-category-title {
    font-size: 1em;
    font-weight: 700;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(138, 43, 226, 0.3);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .library-quest-item {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(138, 43, 226, 0.2);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .library-quest-info {
    flex: 1;
    min-width: 150px;
  }

  .library-quest-title {
    font-weight: 600;
    color: #fff;
    font-size: 0.95em;
    margin-bottom: 4px;
  }

  .library-quest-meta {
    font-size: 0.78em;
    color: #8a7aae;
  }

  .library-add-btn {
    background: linear-gradient(145deg, #d4af37, #a8841f);
    color: #000;
    border: none;
    padding: 8px 16px;
    border-radius: 3px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.8em;
    white-space: nowrap;
  }

  .library-add-btn:active { transform: scale(0.95); }

  .quest-card {
    background: linear-gradient(145deg, rgba(15, 10, 25, 0.8), rgba(20, 12, 35, 0.8));
    border: 1px solid rgba(138, 43, 226, 0.25);
    border-left: 3px solid #8a2be2;
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .quest-card.completed { opacity: 0.5; border-left-color: #4bff6b; }
  .quest-card.daily { border-left-color: #d4af37; }
  .quest-card.mind { border-left-color: #4a9eff; }

  .quest-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 10px;
  }

  .quest-title { font-size: 1.05em; font-weight: 700; color: #fff; }

  .quest-type-badge {
    padding: 3px 12px;
    border-radius: 2px;
    font-size: 0.65em;
    font-weight: 700;
    text-transform: uppercase;
    white-space: nowrap;
    letter-spacing: 1px;
  }

  .badge-daily { background: rgba(212,175,55,0.2); color: #d4af37; border: 1px solid #d4af37; }
  .badge-main { background: rgba(255,107,107,0.2); color: #ff6b6b; border: 1px solid #ff6b6b; }
  .badge-side { background: rgba(107,155,255,0.2); color: #6b9bff; border: 1px solid #6b9bff; }
  .badge-mind { background: rgba(74,158,255,0.2); color: #4a9eff; border: 1px solid #4a9eff; }

  .quest-description { color: #8a7aae; font-size: 0.88em; margin-bottom: 15px; }

  .quest-rewards {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .reward-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.82em;
    color: #d4af37;
    font-weight: 600;
  }

  .quest-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.85em;
    -webkit-appearance: none;
    letter-spacing: 0.5px;
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary { background: linear-gradient(145deg, #8a2be2, #5a1b9e); color: white; }
  .btn-success { background: linear-gradient(145deg, #d4af37, #a8841f); color: #000; }
  .btn-danger { background: linear-gradient(145deg, #ff4757, #c0392b); color: white; }
  .btn-secondary { background: rgba(255,255,255,0.08); color: #8a7aae; border: 1px solid rgba(255,255,255,0.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .add-quest-form {
    background: rgba(10, 6, 18, 0.7);
    border: 1px dashed rgba(212, 175, 55, 0.3);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 15px;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 0.8em; color: #8a7aae; letter-spacing: 0.5px; }

  input, select, textarea {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(138, 43, 226, 0.3);
    border-radius: 4px;
    padding: 12px;
    color: #fff;
    font-size: 16px;
    -webkit-appearance: none;
    font-family: 'Rajdhani', sans-serif;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #d4af37;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
  }

  textarea { resize: vertical; min-height: 60px; }

  .achievements-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 12px;
  }

  .achievement-card {
    background: rgba(10, 6, 18, 0.7);
    border: 1px solid rgba(138, 43, 226, 0.2);
    border-radius: 4px;
    padding: 18px;
    text-align: center;
  }

  .achievement-card.unlocked { border-color: #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
  .achievement-card.locked { opacity: 0.35; filter: grayscale(1); }

  .achievement-icon { font-size: 2.6em; margin-bottom: 8px; }
  .achievement-name { font-weight: 700; color: #fff; margin-bottom: 4px; font-size: 0.85em; }
  .achievement-desc { font-size: 0.7em; color: #8a7aae; }

  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }

  .skill-card {
    background: rgba(10, 6, 18, 0.7);
    border: 1px solid rgba(138, 43, 226, 0.25);
    border-radius: 4px;
    padding: 20px;
  }

  .skill-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .skill-icon { font-size: 1.8em; }

  .skill-level { display: flex; gap: 3px; margin-top: 10px; flex-wrap: wrap; }

  .skill-level-dot {
    width: 18px; height: 7px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
  }

  .skill-level-dot.filled { background: linear-gradient(90deg, #8a2be2, #d4af37); }

  .log-container {
    background: rgba(0,0,0,0.4);
    border-radius: 4px;
    padding: 15px;
    max-height: 400px;
    overflow-y: auto;
  }

  .log-entry {
    padding: 10px;
    border-bottom: 1px solid rgba(138, 43, 226, 0.1);
    display: flex;
    justify-content: space-between;
    font-size: 0.82em;
    gap: 10px;
    flex-wrap: wrap;
  }

  .log-time { color: #8a7aae; font-size: 0.8em; white-space: nowrap; }

  .level-up-modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .level-up-modal.show { display: flex; }

  .level-up-content { text-align: center; animation: levelUpAppear 0.6s ease; padding: 20px; }

  @keyframes levelUpAppear {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  .level-up-text {
    font-family: 'Cinzel', serif;
    font-size: 2.6em;
    font-weight: 900;
    background: linear-gradient(135deg, #d4af37, #fff6d9, #d4af37);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 1.5s linear infinite;
    margin-bottom: 20px;
    letter-spacing: 3px;
  }

  .level-up-subtext { font-size: 1.2em; color: #fff; margin-bottom: 30px; }

  .quest-notification {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top));
    right: 20px; left: 20px;
    background: linear-gradient(145deg, rgba(15, 10, 25, 0.97), rgba(25, 15, 40, 0.97));
    border: 1px solid #d4af37;
    border-radius: 4px;
    padding: 15px 20px;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    transform: translateY(-150px);
    transition: transform 0.4s ease;
    z-index: 999;
    text-align: center;
    font-weight: 600;
  }

  .quest-notification.show { transform: translateY(0); }

  .empty-state { text-align: center; padding: 40px; color: #5a4a7e; }
  .empty-state-icon { font-size: 3em; margin-bottom: 15px; opacity: 0.4; }

  @media (max-width: 600px) {
    .system-title { font-size: 1.8em; }
    .form-row { grid-template-columns: 1fr; }
    .player-header { flex-direction: column; align-items: flex-start; }
    .level-display { text-align: left; }
    .quest-notification { right: 10px; left: 10px; }
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
  ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: linear-gradient(145deg, #0d0815, #150a22);
    border: 1px solid #d4af37;
    border-radius: 4px;
    padding: 30px;
    max-width: 450px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-box h3 { 
    font-family: 'Cinzel', serif;
    margin-bottom: 20px; 
    color: #d4af37; 
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="system-header">
    <div class="system-title">SYSTEM</div>
    <div class="subtitle">Путь Монарха начинается здесь</div>
    <div class="divider"></div>
  </div>

  <div class="player-card">
    <div class="player-header">
      <div class="player-name-section">
        <div class="player-avatar" id="avatarDisplay" onclick="openSettings()">👤</div>
        <div class="player-info">
          <h2 id="playerName">Игрок</h2>
          <span class="player-rank" id="playerRank">E-RANK</span>
        </div>
      </div>
      <div class="level-display">
        <div class="level-number" id="levelNumber">1</div>
        <div class="level-label">LEVEL</div>
      </div>
    </div>

    <div class="exp-container">
      <div class="exp-labels">
        <span>ОПЫТ</span>
        <span id="expText">0 / 100</span>
      </div>
      <div class="exp-bar-bg">
        <div class="exp-bar-fill" id="expBar" style="width: 0%"></div>
      </div>
    </div>

    <div class="free-points" id="freePointsDisplay" style="display:none;">
      ⭐ ОЧКОВ ДОСТУПНО: <span id="freePointsCount">0</span>
    </div>

    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('quests', this)">📜 Квесты</div>
    <div class="nav-tab" onclick="switchTab('skills', this)">⚡ Навыки</div>
    <div class="nav-tab" onclick="switchTab('achievements', this)">🏆 Награды</div>
    <div class="nav-tab" onclick="switchTab('log', this)">📋 История</div>
  </div>

  <div class="tab-content active" id="quests">
    <div class="section-title">
      <span>📜 Активные квесты</span>
      <button class="library-btn" onclick="openLibrary()">📚 Библиотека квестов</button>
    </div>
    
    <div class="add-quest-form">
      <div class="form-row">
        <div class="form-group">
          <label>Название квеста</label>

  { id: 'level_10', name: 'D-Rank Hunter', desc: 'Достигни 10 уровня', icon: '✨', check: (d) => d.level >= 10 },
  { id: 'level_20', name: 'C-Rank Hunter', desc: 'Достигни 20 уровня', icon: '💫', check: (d) => d.level >= 20 },
  { id: 'level_50', name: 'S-Rank Hunter', desc: 'Монарх теней!', icon: '👑', check: (d) => d.level >= 50 },
  { id: 'streak_7', name: 'Недельная серия', desc: '7 дней подряд', icon: '🔥', check: (d) => d.streak >= 7 },

  { id: 'main_quest', name: 'Главный герой', desc: '5 основных квестов', icon: '📖', check: (d) => d.mainQuestsCompleted >= 5 },
];

const DEFAULT_SKILLS = [
  { id: 'focus', name: 'Концентрация', icon: '🎯', level: 1, desc: 'Улучшает фокус при выполнении задач' },
  { id: 'discipline', name: 'Дисциплина', icon: '⚡', level: 1, desc: 'Сила воли для регулярных тренировок' },
  { id: 'endurance', name: 'Выносливость духа', icon: '🔥', level: 1, desc: 'Способность не сдаваться' },
];

// БИБЛИОТЕКА ГОТОВЫХ КВЕСТОВ
const QUEST_LIBRARY = {
  body: {
    name: '💪 Тело',
    color: '#ff6b6b',
    quests: [
      { title: 'Утренняя зарядка', desc: '20 отжиманий, 20 приседаний, планка 1 минута', type: 'daily', exp: 25, stat: 'str' },
      { title: 'Пробежка 3 км', desc: 'Пробеги минимум 3 километра', type: 'daily', exp: 30, stat: 'agi' },

      { title: 'Растяжка', desc: '15 минут растяжки всего тела', type: 'daily', exp: 15, stat: 'agi' },

    quests: [
      { title: 'Чтение книги', desc: 'Прочитай минимум 20 страниц любой полезной книги', type: 'mind', exp: 20, stat: 'int' },
      { title: 'Изучение языка', desc: '20 минут практики иностранного языка', type: 'mind', exp: 25, stat: 'int' },
      { title: 'Решение головоломки', desc: 'Реши судоку, шахматную задачу или логическую головоломку', type: 'mind', exp: 15, stat: 'int' },
      { title: 'Онлайн-курс', desc: 'Пройди один урок на Coursera/Udemy/YouTube', type: 'mind', exp: 30, stat: 'int' },

      { title: 'Медитация', desc: '10 минут медитации или осознанного дыхания', type: 'mind', exp: 20, stat: 'per' },

      { title: 'Подкаст/лекция', desc: 'Прослушай обучающий подкаст 30+ минут', type: 'mind', exp: 20, stat: 'int' },

  spirit: {
    name: '✨ Дух',
    color: '#d4af37',
    quests: [
      { title: 'Благодарность', desc: 'Запиши 3 вещи, за которые ты благодарен сегодня', type: 'daily', exp: 15, stat: 'per' },
      { title: 'Ранний подъём', desc: 'Встань до 7 утра', type: 'daily', exp: 20, stat: 'vit' },
      { title: 'Помощь другому', desc: 'Сделай доброе дело для кого-то без ожидания награды', type: 'side', exp: 25, stat: 'per' },
      { title: 'Заправленная постель', desc: 'Застели кровать сразу после пробуждения', type: 'daily', exp: 10, stat: 'vit' },
      { title: 'План на день', desc: 'Составь чёткий план задач на завтра', type: 'daily', exp: 15, stat: 'int' },
      { title: 'Неделя без жалоб', desc: '7 дней не жаловаться ни на что', type: 'main', exp: 70, stat: 'vit' },
      { title: 'Уборка пространства', desc: 'Убери и наведи порядок в своей комнате', type: 'side', exp: 20, stat: 'vit' },
      { title: 'Разговор с близким', desc: 'Позвони родителям или другу, с которым давно не общался', type: 'side', exp: 20, stat: 'per' },
    ]
  }
};

let gameData = {
  name: 'Игрок',
  avatar: '👤',
  level: 1,
  exp: 0,
  expToNext: 100,
  freePoints: 0,
  stats: { str: 10, agi: 10, int: 10, vit: 10, per: 10 },
  quests: [],
  questsCompleted: 0,
  mainQuestsCompleted: 0,
  achievements: [],
  skills: JSON.parse(JSON.stringify(DEFAULT_SKILLS)),
  logs: [],
  streak: 0,
  lastActiveDate: null
};

function saveData() {
  localStorage.setItem('soloLevelingData', JSON.stringify(gameData));
}

function loadData() {
  const saved = localStorage.getItem('soloLevelingData');
  if (saved) {
    const parsed = JSON.parse(saved);
    gameData = { ...gameData, ...parsed };
  } else {
    addDefaultQuests();
  }
  checkStreak();
}

function addDefaultQuests() {
  gameData.quests = [
    { id: Date.now() + 1, title: 'Утренняя зарядка', desc: '20 отжиманий, 20 приседаний, планка 1 минута', type: 'daily', exp: 25, stat: 'str', completed: false },
    { id: Date.now() + 2, title: 'Чтение книги', desc: 'Прочитай минимум 20 страниц', type: 'mind', exp: 20, stat: 'int', completed: false },
    { id: Date.now() + 3, title: 'Пробежка', desc: 'Пробеги минимум 3 км', type: 'daily', exp: 30, stat: 'agi', completed: false },
    { id: Date.now() + 4, title: 'Медитация', desc: '10 минут осознанного дыхания', type: 'mind', exp: 20, stat: 'per', completed: false },
    { id: Date.now() + 5, title: 'Победи своего врага - Лень', desc: 'Заверши первую неделю без пропусков', type: 'main', exp: 100, stat: 'vit', completed: false }
  ];
}

function checkStreak() {
  const today = new Date().toDateString();
  if (gameData.lastActiveDate) {
    const last = new Date(gameData.lastActiveDate);
    const diff = Math.floor((new Date(today) - new Date(last.toDateString())) / (1000*60*60*24));
    if (diff > 1) gameData.streak = 0;
  }
}

function getCurrentRank(level) {
  return RANKS.find(r => level >= r.min && level <= r.max) || RANKS[0];
}

function renderPlayer() {
  document.getElementById('playerName').textContent = gameData.name;
  document.getElementById('avatarDisplay').textContent = gameData.avatar;
  document.getElementById('levelNumber').textContent = gameData.level;
  
  const rank = getCurrentRank(gameData.level);
  const rankEl = document.getElementById('playerRank');
  rankEl.textContent = rank.name;
  rankEl.style.borderColor = rank.color;
  rankEl.style.color = rank.color;
  
  document.getElementById('expText').textContent = `${gameData.exp} / ${gameData.expToNext}`;
  const expPercent = (gameData.exp / gameData.expToNext) * 100;
  document.getElementById('expBar').style.width = `${expPercent}%`;
  
  const freePointsDisplay = document.getElementById('freePointsDisplay');
  if (gameData.freePoints > 0) {
    freePointsDisplay.style.display = 'block';
    document.getElementById('freePointsCount').textContent = gameData.freePoints;
  } else {
    freePointsDisplay.style.display = 'none';
  }
  
  renderStats();
}

function renderStats() {
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  
  for (const [key, info] of Object.entries(STAT_INFO)) {
    const value = gameData.stats[key];
    const box = document.createElement('div');
    box.className = 'stat-box';
    box.innerHTML = `
      <div class="stat-icon">${info.icon}</div>
      <div class="stat-name">${info.name}</div>
      <div class="stat-value">${value}</div>
      ${gameData.freePoints > 0 ? `<button class="stat-points-btn" onclick="addStatPoint('${key}')">+</button>` : ''}
    `;
    grid.appendChild(box);
  }
}

function addStatPoint(statKey) {
  if (gameData.freePoints > 0) {
    gameData.stats[statKey]++;
    gameData.freePoints--;
    addLog(`Характеристика "${STAT_INFO[statKey].name}" увеличена до ${gameData.stats[statKey]}`);
    saveData();
    renderPlayer();
    checkAchievements();
  }
}

function renderQuests() {
  const list = document.getElementById('questsList');
  list.innerHTML = '';
  
  if (gameData.quests.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div>Нет активных квестов. Открой библиотеку или создай свой!</div></div>`;
    return;
  }
  
  const sorted = [...gameData.quests].sort((a, b) => {
    if (a.completed !== b.completed) return a.completed ? 1 : -1;
    return 0;
  });
  
  sorted.forEach(quest => {
    const card = document.createElement('div');
    card.className = `quest-card ${quest.type} ${quest.completed ? 'completed' : ''}`;
    
    const badgeMap = {
      daily: { cls: 'badge-daily', text: 'Ежедневный' },
      main: { cls: 'badge-main', text: 'Основной' },
      side: { cls: 'badge-side', text: 'Побочный' },
      mind: { cls: 'badge-mind', text: 'Разум' }
    };
    const badge = badgeMap[quest.type] || badgeMap.side;
    
    card.innerHTML = `
      <div class="quest-header">
        <div class="quest-title">${quest.completed ? '✅ ' : ''}${quest.title}</div>
        <span class="quest-type-badge ${badge.cls}">${badge.text}</span>
      </div>
      <div class="quest-description">${quest.desc || 'Без описания'}</div>
      <div class="quest-rewards">
        <div class="reward-item">⭐ +${quest.exp} EXP</div>
        <div class="reward-item">${STAT_INFO[quest.stat].icon} +1 ${STAT_INFO[quest.stat].name}</div>
      </div>
      <div class="quest-actions">
        ${!quest.completed ? 
          `<button class="btn btn-success" onclick="completeQuest(${quest.id})">✓ Выполнить</button>
           <button class="btn btn-danger" onclick="deleteQuest(${quest.id})">✕ Удалить</button>` :
          `<button class="btn btn-secondary" disabled>Выполнено</button>`
        }
      </div>
    `;
    list.appendChild(card);
  });
}

function renderSkills() {
  const grid = document.getElementById('skillsGrid');
  grid.innerHTML = '';
  
  gameData.skills.forEach(skill => {
    const card = document.createElement('div');
    card.className = 'skill-card';
    
    let dots = '';
    for (let i = 1; i <= 10; i++) {
      dots += `<div class="skill-level-dot ${i <= skill.level ? 'filled' : ''}"></div>`;
    }
    
    card.innerHTML = `
      <div class="skill-header">
        <div class="skill-icon">${skill.icon}</div>
        <div>
          <div style="font-weight:700; color:#fff;">${skill.name}</div>
          <div style="font-size:0.8em; color:#8a7aae;">Уровень ${skill.level}/10</div>
        </div>
      </div>
      <div style="font-size:0.85em; color:#8a7aae; margin-bottom:10px;">${skill.desc}</div>
      <div class="skill-level">${dots}</div>
    `;
    grid.appendChild(card);
  });
}

function renderAchievements() {
  const grid = document.getElementById('achievementsGrid');
  grid.innerHTML = '';
  
  ACHIEVEMENTS_LIST.forEach(ach => {
    const unlocked = gameData.achievements.includes(ach.id);
    const card = document.createElement('div');
    card.className = `achievement-card ${unlocked ? 'unlocked' : 'locked'}`;
    card.innerHTML = `
      <div class="achievement-icon">${ach.icon}</div>
      <div class="achievement-name">${ach.name}</div>
      <div class="achievement-desc">${ach.desc}</div>
    `;
    grid.appendChild(card);
  });
}

function renderLog() {
  const container = document.getElementById('logContainer');
  container.innerHTML = '';
  
  if (gameData.logs.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><div>История пуста</div></div>`;
    return;
  }
  
  [...gameData.logs].reverse().forEach(log => {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span>${log.text}</span><span class="log-time">${log.time}</span>`;
    container.appendChild(entry);
  });
}

function renderAll() {
  renderPlayer();
  renderQuests();
  renderSkills();
  renderAchievements();
  renderLog();
}

function addLog(text) {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}) + ' · ' + now.toLocaleDateString('ru-RU');
  gameData.logs.push({ text, time: timeStr });
  if (gameData.logs.length > 100) gameData.logs.shift();
}

function addQuest() {
  const title = document.getElementById('questTitle').value.trim();
  const desc = document.getElementById('questDesc').value.trim();
  const type = document.getElementById('questType').value;
  const exp = parseInt(document.getElementById('questExp').value) || 20;
  const stat = document.getElementById('questStat').value;
  
  if (!title) {
    showNotification('⚠️ Введи название квеста!');
    return;
  }
  
  gameData.quests.push({ id: Date.now(), title, desc, type, exp, stat, completed: false });
  saveData();
  renderQuests();
  
  document.getElementById('questTitle').value = '';
  document.getElementById('questDesc').value = '';
  document.getElementById('questExp').value = '20';
  
  showNotification('✨ Новый квест создан!');
}

function completeQuest(id) {
  const quest = gameData.quests.find(q => q.id === id);
  if (!quest || quest.completed) return;
  
  quest.completed = true;
  gameData.questsCompleted++;
  if (quest.type === 'main') gameData.mainQuestsCompleted++;
  
  gameData.stats[quest.stat]++;
  
  const today = new Date().toDateString();
  if (gameData.lastActiveDate !== today) {
    gameData.streak++;
    gameData.lastActiveDate = today;
  }
  
  addLog(`Квест выполнен: "${quest.title}" (+${quest.exp} EXP, +1 ${STAT_INFO[quest.stat].name})`);
  
  addExp(quest.exp);
  
  if (Math.random() > 0.5) {
    const skill = gameData.skills[Math.floor(Math.random() * gameData.skills.length)];
    if (skill.level < 10) {
      skill.level++;
      addLog(`Навык "${skill.name}" повышен до уровня ${skill.level}!`);
    }
  }
  
  saveData();
  renderAll();
  checkAchievements();
  showNotification(`✅ Квест выполнен! +${quest.exp} EXP`);
}

function deleteQuest(id) {
  gameData.quests = gameData.quests.filter(q => q.id !== id);
  saveData();
  renderQuests();
}

function addExp(amount) {
  gameData.exp += amount;
  
  while (gameData.exp >= gameData.expToNext) {
    gameData.exp -= gameData.expToNext;
    gameData.level++;
    gameData.expToNext = Math.floor(100 * Math.pow(1.15, gameData.level - 1));
    gameData.freePoints += 3;
    
    showLevelUp();
    addLog(`🎉 ДОСТИГНУТ УРОВЕНЬ ${gameData.level}!`);
  }
}

function showLevelUp() {
  document.getElementById('levelUpText').textContent = `Ты достиг уровня ${gameData.level}!`;
  document.getElementById('levelUpModal').classList.add('show');
}

function closeLevelUp() {
  document.getElementById('levelUpModal').classList.remove('show');
}

function checkAchievements() {
  ACHIEVEMENTS_LIST.forEach(ach => {
    if (!gameData.achievements.includes(ach.id) && ach.check(gameData)) {
      gameData.achievements.push(ach.id);
      addLog(`🏆 Достижение разблокировано: "${ach.name}"`);
      showNotification(`🏆 Достижение: ${ach.name}`);
    }
  });
  saveData();
  renderAchievements();
}

function showNotification(text) {
  const notif = document.getElementById('questNotif');
  notif.textContent = text;
  notif.classList.add('show');
  setTimeout(() => notif.classList.remove('show'), 3000);
}

function switchTab(tabId, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  el.classList.add('active');
}

function openSettings() {
  document.getElementById('settingsName').value = gameData.name;
  document.getElementById('settingsAvatar').value = gameData.avatar;
  document.getElementById('settingsModal').classList.add('show');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
}

function saveSettings() {
  const name = document.getElementById('settingsName').value.trim();
  const avatar = document.getElementById('settingsAvatar').value.trim();
  
  if (name) gameData.name = name;
  if (avatar) gameData.avatar = avatar;
  
  saveData();
  renderPlayer();
  closeSettings();
  showNotification('✅ Настройки сохранены!');
}

function resetProgress() {
  if (confirm('Ты уверен? Весь прогресс будет удалён безвозвратно!')) {
    localStorage.removeItem('soloLevelingData');
    location.reload();
  }
}

// БИБЛИОТЕКА КВЕСТОВ
function openLibrary() {
  const content = document.getElementById('libraryContent');
  content.innerHTML = '';
  
  for (const [key, category] of Object.entries(QUEST_LIBRARY)) {
    const catDiv = document.createElement('div');
    catDiv.className = 'library-category';
    
    let questsHtml = '';
    category.quests.forEach((q, idx) => {
      questsHtml += `
        <div class="library-quest-item">
          <div class="library-quest-info">
            <div class="library-quest-title">${q.title}</div>
            <div class="library-quest-meta">+${q.exp} EXP · ${STAT_INFO[q.stat].icon} ${STAT_INFO[q.stat].name}</div>
          </div>
          <button class="library-add-btn" onclick="addFromLibrary('${key}', ${idx})">+ Добавить</button>
        </div>
      `;
    });
    
    catDiv.innerHTML = `
      <div class="library-category-title" style="color:${category.color};">${category.name}</div>
      ${questsHtml}
    `;
    content.appendChild(catDiv);
  }
  
  document.getElementById('libraryModal').classList.add('show');
}

function closeLibrary() {
  document.getElementById('libraryModal').classList.remove('show');
}

function addFromLibrary(categoryKey, questIdx) {
  const q = QUEST_LIBRARY[categoryKey].quests[questIdx];
  gameData.quests.push({
    id: Date.now(),
    title: q.title,
    desc: q.desc,
    type: q.type,
    exp: q.exp,
    stat: q.stat,
    completed: false
  });
  saveData();
  renderQuests();
  showNotification(`✨ Квест "${q.title}" добавлен!`);
}

function createParticles() {
  const container = document.getElementById('particles');
  const count = 25;
  
  for (let i = 0; i < count; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 15 + 's';
    particle.style.animationDuration = (12 + Math.random() * 10) + 's';
    container.appendChild(particle);
  }
}

function checkDailyReset() {
  const today = new Date().toDateString();
  const lastReset = localStorage.getItem('lastDailyReset');
  
  if (lastReset !== today) {
    gameData.quests.forEach(q => {
      if (q.type === 'daily' || q.type === 'mind') q.completed = false;
    });
    localStorage.setItem('lastDailyReset', today);
    saveData();
  }
}

window.onload = function() {
  loadData();
  checkDailyReset();
  createParticles();
  renderAll();
  
  if (gameData.questsCompleted === 0 && gameData.level === 1) {
    setTimeout(() => {
      showNotification('⚔️ Добро пожаловать, Игрок! Начни свой путь к силе!');
    }, 1000);
  }
};

setInterval(saveData, 30000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('Service Worker зарегистрирован'))
      .catch(err => console.log('Ошибка SW:', err));
  });
}
</script>
