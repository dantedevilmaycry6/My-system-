<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYSTEM">
<meta name="theme-color" content="#000000">
<title>SYSTEM</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-bg:#000000;
  --c-panel:#120f1c;
  --c-panel-light:#1b1729;
  --c-border:#2a2440;
  --c-gold:#d4af37;
  --c-gold-light:#f3dd8a;
  --c-gold-dim:#8a6d1f;
  --c-purple:#8a2be2;
  --c-purple-dark:#6b2fbf;
  --c-purple-light:#b27cff;
  --c-text:#d8d4e8;
  --c-text-dim:#8a84a8;
  --c-red:#ff4b4b;
  --c-blue:#4a9eff;
  --c-orange:#ff9b6b;
  --font-head:'Cinzel',serif;
  --font-body:'Rajdhani',sans-serif;
  --radius:12px;
  --radius-sm:8px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font-body);overscroll-behavior:none;}
body{
  min-height:100vh;
  padding-bottom:calc(72px + var(--safe-bottom));
  background:
    radial-gradient(ellipse at 50% 20%, rgba(138,43,226,.10), transparent 55%),
    var(--c-bg);
}
h1,h2,h3,.font-head{font-family:var(--font-head);}
button{font-family:var(--font-body);cursor:pointer;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--c-gold-dim);}

/* сплошная заливка под чёлку/остров, чтобы ничего не просвечивало */
#statusbarCover{
  position:fixed;top:0;left:0;right:0;height:var(--safe-top);
  background:#000;z-index:500;pointer-events:none;
}

/* ==================== SPLASH ==================== */
#splash{
  position:fixed;inset:0;z-index:999;background:var(--c-bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .6s ease, visibility .6s ease;
}
#splash.hide{opacity:0;visibility:hidden;}
.splash-logo{
  font-family:var(--font-head);font-weight:900;font-size:38px;letter-spacing:8px;
  background:linear-gradient(135deg,var(--c-gold-light),var(--c-purple-light));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pulse-glow 1.8s ease-in-out infinite;
}
.splash-sub{font-size:12px;letter-spacing:4px;color:var(--c-text-dim);text-transform:uppercase;}
.splash-bar{width:180px;height:2px;background:var(--c-border);border-radius:2px;overflow:hidden;}
.splash-bar::after{
  content:'';display:block;height:100%;width:40%;
  background:linear-gradient(90deg,var(--c-gold),var(--c-purple));
  animation:loadbar 1.5s ease-in-out infinite;
}
@keyframes loadbar{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
@keyframes pulse-glow{0%,100%{filter:drop-shadow(0 0 6px rgba(212,175,55,.5));}50%{filter:drop-shadow(0 0 16px rgba(138,43,226,.7));}}

/* ==================== PARTICLES ==================== */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ==================== APP ==================== */
#app{display:none;position:relative;z-index:1;}

/* ---- HUD ---- */
.hud{
  padding:calc(14px + var(--safe-top)) 16px 14px;
  background:linear-gradient(180deg, rgba(18,15,28,.95), rgba(10,8,16,.85));
  border-bottom:1px solid var(--c-border);
  position:sticky;top:0;z-index:20;
  backdrop-filter:blur(8px);
}
.hud-top{display:flex;align-items:center;gap:12px;}
.avatar-wrap{position:relative;width:54px;height:54px;flex-shrink:0;}
.avatar-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;
  background:conic-gradient(var(--c-gold),var(--c-purple),var(--c-gold)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.avatar{
  position:absolute;inset:4px;border-radius:50%;background:var(--c-panel);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:inset 0 0 10px rgba(0,0,0,.6);
}
.hud-info{flex:1;min-width:0;}
.hud-name{font-family:var(--font-head);font-weight:700;font-size:16px;color:var(--c-gold-light);line-height:1.2;}
.hud-title{font-size:11px;font-style:italic;color:var(--c-purple-light);margin:1px 0 3px;}
.hud-rank{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;}
.hud-icons{display:flex;gap:12px;align-items:center;}
.hud-icon{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--c-gold-light);}
.hud-icon svg{color:var(--c-gold);}
.hud-icon.flame svg{color:var(--c-orange);}
.hud-level-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:11px;color:var(--c-text-dim);}
.hud-level-row b{color:var(--c-gold-light);font-size:13px;}
.exp-bar{height:7px;border-radius:6px;background:var(--c-panel-light);overflow:hidden;margin-top:4px;position:relative;border:1px solid var(--c-border);}
.exp-fill{height:100%;background:linear-gradient(90deg,var(--c-purple-dark),var(--c-purple),var(--c-gold));border-radius:6px;position:relative;transition:width .6s ease;}
.exp-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  width:40%;animation:shimmer 2.2s linear infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}

/* ---- TABS NAV ---- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:space-around;
  background:linear-gradient(0deg, rgba(5,4,10,.98), rgba(10,8,18,.9));
  border-top:1px solid var(--c-border);
  padding:7px 4px calc(7px + var(--safe-bottom));
  backdrop-filter:blur(10px);
}
.nav-btn{
  background:none;border:none;color:var(--c-text-dim);display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:8.5px;letter-spacing:.2px;padding:4px 6px;border-radius:var(--radius-sm);transition:color .2s;font-weight:600;
}
.nav-btn svg{transition:filter .2s;}
.nav-btn.active{color:var(--c-gold-light);}
.nav-btn.active svg{filter:drop-shadow(0 0 5px rgba(212,175,55,.7));}

/* ---- TAB CONTENT ---- */
.tab-content{display:none;padding:16px;animation:fadein .3s ease;}
.tab-content.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.section-title{
  font-family:var(--font-head);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--c-gold-light);margin:0 0 12px;
}

/* ---- CARD BASE ---- */
.card{
  position:relative;background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;
}
.corner::before,.corner::after{
  content:'';position:absolute;width:14px;height:14px;border:2px solid var(--c-gold);opacity:.6;
}
.corner::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
.corner::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}

/* ---- STATS ---- */
.points-banner{
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg, rgba(138,43,226,.15), rgba(212,175,55,.1));
  border:1px solid var(--c-gold-dim);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13px;
}
.points-banner b{color:var(--c-gold-light);font-size:18px;}
.stat-card{display:flex;align-items:center;gap:10px;}
.stat-card svg{color:var(--c-gold);flex-shrink:0;}
.stat-name{font-size:11px;color:var(--c-text-dim);text-transform:uppercase;letter-spacing:1px;}
.stat-value{font-family:var(--font-head);font-size:19px;color:var(--c-gold-light);}
.stat-plus{
  margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--c-gold);background:none;
  color:var(--c-gold);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.stat-plus:disabled{opacity:.25;}

.icon-btn-row{display:flex;gap:10px;margin-top:4px;}
.icon-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;
  background:var(--c-panel-light);border:1px solid var(--c-border);border-radius:var(--radius-sm);
  color:var(--c-text-dim);font-size:12px;
}
.icon-btn svg{color:var(--c-gold);}
.icon-btn.danger svg{color:var(--c-red);}

/* ---- QUESTS ---- */
.quest-card{border-left:3px solid var(--c-gold);display:flex;align-items:center;gap:10px;}
.quest-info{flex:1;min-width:0;}
.quest-name{font-size:14px;font-weight:600;color:var(--c-text);}
.quest-meta{font-size:11px;color:var(--c-text-dim);margin-top:2px;}
.quest-done{opacity:.4;text-decoration:line-through;}
.quest-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--c-gold);background:none;color:var(--c-gold);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.quest-del{background:none;border:none;color:var(--c-text-dim);font-size:16px;padding:4px;}
.add-quest-btn{
  width:100%;padding:12px;border-radius:var(--radius);border:1px dashed var(--c-gold-dim);background:none;
  color:var(--c-gold-light);font-size:13px;letter-spacing:1px;margin-top:4px;
}
.lib-btn{
  width:100%;padding:12px;border-radius:var(--radius);border:1px solid var(--c-purple-dark);
  background:rgba(138,43,226,.08);color:var(--c-purple-light);font-size:13px;letter-spacing:1px;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}

/* ---- ACHIEVEMENTS ---- */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ach-card{text-align:center;padding:16px 8px;}
.ach-icon{font-size:26px;margin-bottom:6px;}
.ach-icon svg{color:var(--c-text-dim);}
.ach-title{font-size:12px;font-weight:700;color:var(--c-gold-light);}
.ach-desc{font-size:10px;color:var(--c-text-dim);margin-top:3px;}
.ach-card.locked{opacity:.4;}

/* ---- SKILLS ---- */
.skill-card{display:flex;align-items:center;gap:12px;}
.skill-icon{font-size:22px;}
.skill-name{font-size:14px;font-weight:600;}
.skill-desc{font-size:11px;color:var(--c-text-dim);}
.skill-card.locked{opacity:.35;}

/* ---- SHOP ---- */
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.shop-card{text-align:center;padding:14px 10px;}
.shop-icon{font-size:28px;margin-bottom:6px;}
.shop-name{font-size:12px;font-weight:600;margin-bottom:8px;}
.shop-buy{
  width:100%;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--c-gold);background:none;
  color:var(--c-gold-light);font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px;
}
.shop-buy:disabled{opacity:.3;}

/* ---- CALENDAR (нормальный, месяц) ---- */
.streak-box{
  display:flex;align-items:center;gap:10px;background:rgba(255,155,107,.08);border:1px solid var(--c-orange);
  border-radius:var(--radius);padding:12px;margin-bottom:14px;font-size:13px;
}
.streak-box svg{color:var(--c-orange);}
.streak-box b{color:var(--c-orange);font-size:18px;}
.cal-card{background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-month{font-family:var(--font-head);color:var(--c-gold-light);font-size:14px;letter-spacing:1px;}
.cal-nav{background:none;border:1px solid var(--c-border);color:var(--c-gold-light);width:28px;height:28px;border-radius:50%;font-size:15px;line-height:1;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--c-text-dim);margin-bottom:6px;letter-spacing:.5px;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:11px;color:var(--c-text-dim);background:var(--c-panel-light);}
.cal-day.empty{background:none;}
.cal-day.today{border:1px solid var(--c-gold);color:var(--c-gold-light);font-weight:700;}
.cal-day.cal-l1{background:#3a2d55;color:var(--c-text);}
.cal-day.cal-l2{background:#5c3f8a;color:#fff;}
.cal-day.cal-l3{background:#8a2be2;color:#fff;}
.cal-day.cal-l4{background:var(--c-gold);color:#1a1206;font-weight:700;}
.cal-legend{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:10px;color:var(--c-text-dim);}
.cal-dot{width:12px;height:12px;border-radius:3px;}
.cal-dot.cal-l0{background:var(--c-panel-light);}
.cal-dot.cal-l1{background:#3a2d55;}
.cal-dot.cal-l2{background:#5c3f8a;}
.cal-dot.cal-l3{background:#8a2be2;}
.cal-dot.cal-l4{background:var(--c-gold);}

/* ---- MODALS ---- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:90;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);
}
.overlay.show{display:flex;}
.modal{
  position:relative;width:100%;max-width:480px;background:var(--c-panel);border:1px solid var(--c-gold-dim);
  border-radius:var(--radius) var(--radius) 0 0;padding:20px;padding-bottom:calc(24px + var(--safe-bottom));
  max-height:82vh;overflow-y:auto;
}
.modal-title{font-family:var(--font-head);color:var(--c-gold-light);font-size:16px;margin-bottom:16px;letter-spacing:1px;}
.field{margin-bottom:12px;}
.field label{font-size:11px;color:var(--c-text-dim);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:5px;}
.field input,.field select{
  width:100%;padding:10px;background:var(--c-panel-light);border:1px solid var(--c-border);border-radius:var(--radius-sm);
  color:var(--c-text);font-family:var(--font-body);font-size:14px;
}
.type-row{display:flex;gap:8px;}
.type-chip{flex:1;padding:8px;text-align:center;border-radius:var(--radius-sm);border:1px solid var(--c-border);font-size:11px;color:var(--c-text-dim);}
.type-chip.active{border-color:var(--c-gold);color:var(--c-gold-light);background:rgba(212,175,55,.1);}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;padding:12px;border-radius:var(--radius-sm);border:none;font-weight:700;font-size:13px;letter-spacing:1px;}
.btn-primary{background:linear-gradient(135deg,var(--c-gold),var(--c-gold-dim));color:#1a1206;}
.btn-ghost{background:var(--c-panel-light);color:var(--c-text-dim);border:1px solid var(--c-border);}

.lib-cat{margin-bottom:18px;}
.lib-cat-title{font-size:12px;letter-spacing:1px;color:var(--c-purple-light);margin-bottom:8px;text-transform:uppercase;}
.lib-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--c-border);font-size:13px;}
.lib-item span{color:var(--c-text-dim);font-size:11px;}
.lib-add{background:none;border:1px solid var(--c-gold);color:var(--c-gold-light);border-radius:50%;width:26px;height:26px;font-size:16px;}

/* ---- TOASTS ---- */
.toast-container{position:fixed;top:calc(90px + var(--safe-top));left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.sys-toast{
  background:rgba(10,8,16,.95);border:1px solid var(--c-gold);border-radius:var(--radius-sm);
  padding:10px 18px;text-align:center;min-width:220px;animation:toastin .3s ease, toastout .4s ease 2.6s forwards;
  box-shadow:0 0 18px rgba(212,175,55,.35);
}
.sys-toast .tt{font-family:var(--font-head);font-size:10px;letter-spacing:2px;color:var(--c-gold);}
.sys-toast .tm{font-size:13px;color:var(--c-text);margin-top:3px;}
@keyframes toastin{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
@keyframes toastout{to{opacity:0;transform:translateY(-10px);}}

/* ---- FX ---- */
#flashOverlay{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:300;}
#flashOverlay.flash{animation:flash .4s ease;}
@keyframes flash{0%{opacity:0;}20%{opacity:.85;}100%{opacity:0;}}
.float-text{
  position:fixed;z-index:250;font-family:var(--font-head);font-weight:700;font-size:15px;pointer-events:none;
  animation:floatup 1.4s ease forwards;
}
.float-text.gold{color:var(--c-gold-light);}
.float-text.purple{color:var(--c-purple-light);}
@keyframes floatup{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-60px);}}
.burst-p{position:fixed;z-index:250;width:5px;height:5px;border-radius:50%;background:var(--c-gold);pointer-events:none;transition:all .8s cubic-bezier(.2,.6,.4,1);}
</style>
</head>
<body>

<div id="statusbarCover"></div>
<div id="splash">
  <div class="splash-logo">SYSTEM</div>
  <div class="splash-sub">Загрузка реальности</div>
  <div class="splash-bar"></div>
</div>

<canvas id="particles"></canvas>
<div id="flashOverlay"></div>
<div class="toast-container" id="toastContainer"></div>

<div id="app">

  <!-- HUD -->
  <div class="hud">
    <div class="hud-top">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar" id="hudAvatar">🗡️</div>
      </div>
      <div class="hud-info">
        <div class="hud-name" id="hudName">Игрок</div>
        <div class="hud-title" id="hudTitle">Без титула</div>
        <div class="hud-rank" id="hudRank">E-RANK</div>
      </div>
      <div class="hud-icons">
        <div class="hud-icon flame"><span id="icFlame"></span><span id="hudStreak">0</span></div>
        <div class="hud-icon"><span id="icGem"></span><span id="hudGems">0</span></div>
      </div>
    </div>
    <div class="hud-level-row">
      <span>Уровень <b id="hudLevel">1</b></span>
      <span id="hudExpText">0 / 100</span>
    </div>
    <div class="exp-bar"><div class="exp-fill" id="hudExpFill" style="width:0%"></div></div>
  </div>

  <!-- PROFILE TAB -->
  <div class="tab-content active" id="tab-profile">
    <div class="points-banner">
      <span>Свободные очки</span>
      <b id="pointsVal">0</b>
    </div>
    <div id="statsGrid"></div>
    <div class="icon-btn-row">
      <button class="icon-btn" onclick="openSettings()"><span id="icGear"></span> Настройки</button>
      <button class="icon-btn danger" onclick="resetProgress()"><span id="icTrash"></span> Сброс</button>
    </div>
  </div>

  <!-- QUESTS TAB -->
  <div class="tab-content" id="tab-quests">
    <div class="section-title">Активные Квесты</div>
    <div id="questsList"></div>
    <button class="add-quest-btn" onclick="openAddQuest()">+ Создать квест</button>
    <button class="lib-btn" onclick="openLibrary()"><span id="icBook"></span> Библиотека квестов</button>
  </div>

  <!-- ACHIEVEMENTS TAB -->
  <div class="tab-content" id="tab-achievements">
    <div class="section-title">Достижения</div>
    <div class="ach-grid" id="achGrid"></div>
  </div>

  <!-- SKILLS TAB -->
  <div class="tab-content" id="tab-skills">
    <div class="section-title">Навыки</div>
    <div id="skillsList"></div>
  </div>

  <!-- SHOP TAB -->
  <div class="tab-content" id="tab-shop">
    <div class="section-title">Магазин Наград</div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>

  <!-- CALENDAR TAB -->
  <div class="tab-content" id="tab-calendar">
    <div class="section-title">Календарь Активности</div>
    <div class="streak-box"><span id="icFlame2"></span> Серия: <b id="streakVal">0</b> дней</div>
    <div class="cal-card">
      <div class="cal-header">
        <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
        <div class="cal-month" id="calMonthLabel">—</div>
        <button class="cal-nav" onclick="changeMonth(1)">›</button>
      </div>

/* ==================== СОСТОЯНИЕ ==================== */
function defaultData(){
  return {
    name:'Игрок', avatar:'🗡️', level:1, exp:0, gems:0, points:0,
    stats:{str:1,agi:1,int:1,vit:1,per:1},
    quests:[], completedCount:0, mainQuestDone:false,
    streak:0, lastActiveDate:null, activityLog:{},
    unlockedAchievements:[], unlockedTitles:['none'], selectedTitle:'none'
  };
}
let gameData = loadData();
function loadData(){
  try{
    const raw = localStorage.getItem('soloLevelingData');
    if(raw) return Object.assign(defaultData(), JSON.parse(raw));
  }catch(e){}
  return defaultData();
}
function saveData(){ localStorage.setItem('soloLevelingData', JSON.stringify(gameData)); }
setInterval(saveData, 30000);

function expForLevel(l){ return Math.floor(100*Math.pow(1.15,l-1)); }
function getRank(level){ let r=RANKS[0]; for(const x of RANKS){ if(level>=x.min) r=x; } return r; }
function getStreakMultiplier(s){ if(s>=30) return 2; if(s>=14) return 1.5; if(s>=7) return 1.25; if(s>=3) return 1.1; return 1; }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function logActivity(){
  const today = todayStr();
  gameData.activityLog[today] = (gameData.activityLog[today]||0)+1;
  if(gameData.lastActiveDate!==today){
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    gameData.streak = (gameData.lastActiveDate===yesterday) ? gameData.streak+1 : 1;
    gameData.lastActiveDate = today;
  }
}

function addExp(amount){
  gameData.exp += amount;
  let needed = expForLevel(gameData.level);
  let leveled=false;
  while(gameData.exp >= needed){
    gameData.exp -= needed;
    gameData.level++;
    gameData.points += 3;
    needed = expForLevel(gameData.level);
    leveled=true;
  }
  if(leveled) levelUpEffect();
  updateTitleUnlocks();
}

function levelUpEffect(){
  flashOverlay();
  spawnBurst();
  showToast('LEVEL UP', 'Уровень '+gameData.level+' достигнут');
}

/* ==================== КВЕСТЫ ==================== */
let addQuestType = 'daily';
function openAddQuest(){
  document.getElementById('newQuestName').value='';
  document.getElementById('newQuestExp').value=20;
  const statSel = document.getElementById('newQuestStat');
  statSel.innerHTML = Object.keys(STAT_INFO).map(k=>`<option value="${k}">${STAT_INFO[k].label}</option>`).join('');
  renderTypeRow();
  document.getElementById('addQuestOverlay').classList.add('show');
}
function renderTypeRow(){
  const typeRow = document.getElementById('typeRow');
  typeRow.innerHTML = Object.keys(QUEST_TYPES).map(k=>`<div class="type-chip ${k===addQuestType?'active':''}" onclick="pickType('${k}')">${QUEST_TYPES[k].label}</div>`).join('');
}
function pickType(t){ addQuestType=t; renderTypeRow(); }
function closeAddQuest(){ document.getElementById('addQuestOverlay').classList.remove('show'); }
function submitAddQuest(){
  const name = document.getElementById('newQuestName').value.trim();
  if(!name){ showToast('Ошибка','Введи название квеста'); return; }
  const exp = parseInt(document.getElementById('newQuestExp').value)||10;
  const stat = document.getElementById('newQuestStat').value;
  gameData.quests.push({id:Date.now(), name, type:addQuestType, exp, stat, done:false});
  saveData(); render(); closeAddQuest();
}
function completeQuest(id){
  const q = gameData.quests.find(x=>x.id===id);
  if(!q || q.done) return;
  q.done = true;
  logActivity();
  const mult = getStreakMultiplier(gameData.streak);
  const expGain = Math.round(q.exp*mult);
  const gemsGain = Math.max(1, Math.round(expGain/10));
  gameData.completedCount++;
  if(q.type==='main') gameData.mainQuestDone = true;
  gameData.gems += gemsGain;
  addExp(expGain);
  spawnFloatText('+'+expGain+' EXP','gold');
  spawnFloatText('+'+gemsGain+' 💎','purple');
  showToast('Квест выполнен', q.name);
  checkAchievements();
  saveData(); render();
}
function deleteQuest(id){
  gameData.quests = gameData.quests.filter(x=>x.id!==id);
  saveData(); render();
}

/* ==================== БИБЛИОТЕКА ==================== */
function openLibrary(){
  let html='';
  for(const key in QUEST_LIBRARY){
    const cat = QUEST_LIBRARY[key];
    html += `<div class="lib-cat"><div class="lib-cat-title">${cat.emoji} ${cat.label}</div>`;
    cat.items.forEach((it,i)=>{
      html += `<div class="lib-item"><div>${it.name}<br><span>${QUEST_TYPES[it.type].label} · ${it.exp} EXP</span></div><button class="lib-add" onclick="addFromLibrary('${key}',${i})">+</button></div>`;
    });
    html += `</div>`;
  }
  document.getElementById('libraryContent').innerHTML = html;
  document.getElementById('libraryOverlay').classList.add('show');
}
function closeLibrary(){ document.getElementById('libraryOverlay').classList.remove('show'); }
function addFromLibrary(catKey, idx){
  const it = QUEST_LIBRARY[catKey].items[idx];
  gameData.quests.push({id:Date.now(), name:it.name, type:it.type, exp:it.exp, stat:it.stat, done:false});
  saveData(); render();
  showToast('Квест добавлен', it.name);
}

/* ==================== СТАТЫ / ТИТУЛЫ ==================== */
function allocatePoint(stat){
  if(gameData.points<=0) return;
  gameData.stats[stat]++; gameData.points--;
  saveData(); render(); checkAchievements();
}
function updateTitleUnlocks(){
  TITLES_LIST.forEach(t=>{
    if(t.cond(gameData) && !gameData.unlockedTitles.includes(t.id)){
      gameData.unlockedTitles.push(t.id);
      if(t.id!=='none') showToast('Новый титул', t.name);
    }
  });
}

/* ==================== ДОСТИЖЕНИЯ ==================== */
function checkAchievements(){
  ACHIEVEMENTS_LIST.forEach(a=>{
    if(a.cond(gameData) && !gameData.unlockedAchievements.includes(a.id)){
      gameData.unlockedAchievements.push(a.id);
      showToast('Достижение разблокировано', a.title);
      spawnBurst();
    }
  });
  saveData();
}

/* ==================== МАГАЗИН ==================== */
function buyItem(id){
  const item = SHOP_ITEMS.find(i=>i.id===id);
  if(!item) return;
  if(gameData.gems < item.cost){ showToast('Недостаточно кристаллов',''); return; }
  gameData.gems -= item.cost;
  saveData(); render();
  showToast('Покупка совершена', item.name);
}

/* ==================== НАСТРОЙКИ ==================== */
function openSettings(){
  document.getElementById('settingsName').value = gameData.name;
  document.getElementById('settingsAvatar').value = gameData.avatar;
  const titleSel = document.getElementById('settingsTitle');
  titleSel.innerHTML = TITLES_LIST.filter(t=>gameData.unlockedTitles.includes(t.id))
    .map(t=>`<option value="${t.id}" ${t.id===gameData.selectedTitle?'selected':''}>${t.name}</option>`).join('');
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings(){ document.getElementById('settingsOverlay').classList.remove('show'); }
function saveSettings(){
  gameData.name = document.getElementById('settingsName').value.trim() || 'Игрок';
  gameData.avatar = document.getElementById('settingsAvatar').value.trim() || '🗡️';
  gameData.selectedTitle = document.getElementById('settingsTitle').value;
  saveData(); render(); closeSettings();
}
function resetProgress(){
  if(confirm('Точно сбросить весь прогресс?')){
    localStorage.removeItem('soloLevelingData');
    location.reload();
  }
}

/* ==================== РЕНДЕР ==================== */
function switchTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add('active');
  if(tab==='calendar') renderCalendar();
}

function render(){
  document.getElementById('hudAvatar').textContent = gameData.avatar;
  document.getElementById('hudName').textContent = gameData.name;
  const titleObj = TITLES_LIST.find(t=>t.id===gameData.selectedTitle) || TITLES_LIST[0];
  document.getElementById('hudTitle').textContent = titleObj.name;
  const rank = getRank(gameData.level);
  const rankEl = document.getElementById('hudRank');
  rankEl.textContent = rank.name; rankEl.style.color = rank.color;
  document.getElementById('hudLevel').textContent = gameData.level;
  const needed = expForLevel(gameData.level);
  document.getElementById('hudExpText').textContent = gameData.exp+' / '+needed;
  document.getElementById('hudExpFill').style.width = Math.min(100,(gameData.exp/needed*100))+'%';
  document.getElementById('hudGems').textContent = gameData.gems;
  document.getElementById('hudStreak').textContent = gameData.streak;
  document.getElementById('icFlame').innerHTML = ic('flame',14);
  document.getElementById('icFlame2').innerHTML = ic('flame',16);
  document.getElementById('icGem').innerHTML = ic('gem',14);
  document.getElementById('icGear').innerHTML = ic('gear',16);
  document.getElementById('icTrash').innerHTML = ic('trash',16);
  document.getElementById('icBook').innerHTML = ic('book',16);
  document.getElementById('navProfile').innerHTML = ic('nProfile',17);
  document.getElementById('navQuests').innerHTML = ic('nQuests',17);
  document.getElementById('navAch').innerHTML = ic('nAch',17);
  document.getElementById('navSkills').innerHTML = ic('nSkills',17);
  document.getElementById('navShop').innerHTML = ic('nShop',17);
  document.getElementById('navCal').innerHTML = ic('nCal',17);

  document.getElementById('pointsVal').textContent = gameData.points;
  document.getElementById('statsGrid').innerHTML = Object.keys(STAT_INFO).map(k=>{
    const info = STAT_INFO[k];
    return `<div class="card stat-card">
      ${ic(info.icon,20)}
      <div><div class="stat-name">${info.label}</div><div class="stat-value">${gameData.stats[k]}</div></div>
      <button class="stat-plus" ${gameData.points<=0?'disabled':''} onclick="allocatePoint('${k}')">+</button>
    </div>`;
  }).join('');

  const ql = document.getElementById('questsList');
  if(gameData.quests.length===0){
    ql.innerHTML = `<div class="card" style="text-align:center;color:var(--c-text-dim);">Квестов пока нет. Создай новый или возьми из библиотеки.</div>`;
  } else {
    ql.innerHTML = gameData.quests.map(q=>`
      <div class="card quest-card" style="border-left-color:${QUEST_TYPES[q.type].color}">
        <div class="quest-info ${q.done?'quest-done':''}">
          <div class="quest-name">${q.name}</div>
          <div class="quest-meta">${QUEST_TYPES[q.type].label} · ${q.exp} EXP · ${STAT_INFO[q.stat].label}</div>
        </div>
        ${q.done
          ? `<button class="quest-del" onclick="deleteQuest(${q.id})">✕</button>`
          : `<button class="quest-btn" onclick="completeQuest(${q.id})">${ic('arrowUp',16)}</button>`}
      </div>`).join('');
  }

  document.getElementById('achGrid').innerHTML = ACHIEVEMENTS_LIST.map(a=>{
    const unlocked = gameData.unlockedAchievements.includes(a.id);
    return `<div class="card ach-card ${unlocked?'':'locked'}">
      <div class="ach-icon">${unlocked ? a.icon : ic('lock',22)}</div>
      <div class="ach-title">${a.title}</div>
      <div class="ach-desc">${a.desc}</div>
    </div>`;
  }).join('');

  document.getElementById('skillsList').innerHTML = SKILLS_LIST.map(s=>{
    const unlocked = gameData.level >= s.levelReq;
    return `<div class="card skill-card ${unlocked?'':'locked'}">
      <div class="skill-icon">${unlocked ? s.icon : '🔒'}</div>
      <div><div class="skill-name">${s.name}</div><div class="skill-desc">${unlocked ? s.desc : 'Открывается на уровне '+s.levelReq}</div></div>
    </div>`;
  }).join('');

  document.getElementById('shopGrid').innerHTML = SHOP_ITEMS.map(it=>`
    <div class="card shop-card">
      <div class="shop-icon">${it.icon}</div>
      <div class="shop-name">${it.name}</div>
      <button class="shop-buy" ${gameData.gems<it.cost?'disabled':''} onclick="buyItem('${it.id}')">${ic('gem',12)} ${it.cost}</button>
    </div>`).join('');

  document.getElementById('streakVal').textContent = gameData.streak;
}

/* ==================== КАЛЕНДАРЬ (месяц) ==================== */
let calendarDate = new Date();
function changeMonth(delta){
  calendarDate.setMonth(calendarDate.getMonth()+delta);
  renderCalendar();
}
function renderCalendar(){
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const y = calendarDate.getFullYear(), m = calendarDate.getMonth();
  document.getElementById('calMonthLabel').textContent = monthNames[m]+' '+y;
  const firstDay = new Date(y,m,1);
  let startWeekday = firstDay.getDay();
  startWeekday = startWeekday===0 ? 6 : startWeekday-1;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayStrVal = todayStr();
  let html='';
  for(let i=0;i<startWeekday;i++) html += '<div class="cal-day empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const count = gameData.activityLog[dateStr]||0;
    let lvl='';
    if(count>=6) lvl='cal-l4'; else if(count>=4) lvl='cal-l3'; else if(count>=2) lvl='cal-l2'; else if(count>=1) lvl='cal-l1';
    const isToday = dateStr===todayStrVal ? 'today' : '';
    html += `<div class="cal-day ${lvl} ${isToday}">${d}</div>`;
  }
  document.getElementById('calDays').innerHTML = html;
}

/* ==================== FX ==================== */
function flashOverlay(){
  const el = document.getElementById('flashOverlay');
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function spawnFloatText(text,color){
  const el = document.createElement('div');
  el.className = 'float-text '+color;
  el.textContent = text;
  el.style.left = (window.innerWidth/2 - 30 + Math.random()*60)+'px';
  el.style.top = '45%';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1500);
}
function spawnBurst(){
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  for(let i=0;i<22;i++){
    const p = document.createElement('div');
    p.className='burst-p';
    p.style.left = cx+'px'; p.style.top = cy+'px';
    p.style.background = Math.random()>.5 ? 'var(--c-gold)' : 'var(--c-purple)';
    document.body.appendChild(p);
    const angle = Math.random()*Math.PI*2, dist = 80+Math.random()*120;
    requestAnimationFrame(()=>{
      p.style.left = (cx+Math.cos(angle)*dist)+'px';
      p.style.top = (cy+Math.sin(angle)*dist)+'px';
      p.style.opacity='0';
    });
    setTimeout(()=>p.remove(), 850);
  }
}
function showToast(title, msg){
  const el = document.createElement('div');
  el.className='sys-toast';
  el.innerHTML = `<div class="tt">◆ СИСТЕМА ◆</div><div class="tt" style="margin-top:2px;">${title}</div><div class="tm">${msg}</div>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>el.remove(), 3100);
}

/* ==================== ЧАСТИЦЫ ФОНА ==================== */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
for(let i=0;i<26;i++){
  particles.push({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    r: 1+Math.random()*2, speed: .2+Math.random()*.5,
    color: Math.random()>.5 ? '212,175,55' : '138,43,226',
    alpha: .2+Math.random()*.5
  });
}
function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.y -= p.speed;
    if(p.y<-5){ p.y=canvas.height+5; p.x=Math.random()*canvas.width; }
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

  render();
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    document.getElementById('app').style.display='block';
  }, 1400);
}
document.addEventListener('DOMContentLoaded', init);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
