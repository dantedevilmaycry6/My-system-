<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Система</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a1f;--s1:#12143a;--s2:#1b1e4d;--line:rgba(170,160,255,.16);--text:#f0eeff;--dim:#9a9cc8;--violet:#9b7bff;--indigo:#5a67ff;--lilac:#cdbfff;--gold:#ffd27a;--rose:#ff6b8a;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(520px 380px at 0% 0%,rgba(110,80,255,.42),transparent 70%),radial-gradient(480px 360px at 100% 22%,rgba(255,80,160,.22),transparent 70%),radial-gradient(520px 420px at 20% 100%,rgba(40,200,255,.16),transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);font:400 15px/1.55 Sora,system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
main{max-width:560px;margin:0 auto;display:grid;gap:18px}
.card{background:linear-gradient(160deg,rgba(32,30,86,.78),rgba(16,18,50,.86));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 40px rgba(5,5,30,.45)}
h2{font:600 14px Sora;color:var(--lilac);margin-bottom:12px}
.dim{color:var(--dim)}.small{font-size:13px}
.hero{background:linear-gradient(135deg,#3a2fa8 0%,#6a37c9 55%,#b0408f 115%);border-color:rgba(205,191,255,.4);box-shadow:0 14px 50px rgba(120,80,255,.4)}
.hero .dim{color:#dcd3ff}
.hr{display:flex;gap:18px;align-items:center}
.ringw{position:relative;width:104px;height:104px;flex:none}
.ringw svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px rgba(110,220,255,.5))}
.ringw div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringw b{font:700 34px/1 Sora;color:#fff}.ringw span{font-size:11px;color:#dcd3ff;margin-top:4px}
input.nm{font:700 22px Sora;background:none;border:0;color:#fff;width:100%;padding:0;outline:0}
.xpl{display:flex;justify-content:space-between;font-size:12px;color:#dcd3ff;margin-top:6px;gap:8px}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#38d5ff,#9b7bff,#ff6bb5);transition:width .6s}
.bar.red i{background:linear-gradient(90deg,#ff9a56,#ff4d79)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{background:rgba(255,255,255,.14);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
input,select,button{font:inherit}
input,select{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 14px;min-width:0}
input::placeholder{color:#7f82ae}
select option,select optgroup{background:#1b1e4d}
.goal{width:100%;margin-top:14px;background:rgba(0,0,0,.2)}
.quote{font-weight:300;font-size:16px;color:var(--lilac);padding:0 4px;line-height:1.6}
.bt{display:flex;justify-content:space-between;font-weight:600}
.grp{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:16px 0 2px}
.grp:first-of-type{margin-top:0}
.q{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.q:last-child{border:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.t{font-weight:600}
.xp{font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);padding:3px 9px;border-radius:99px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--c);background:none;cursor:pointer;color:#0a0b1e;font-weight:700;display:grid;place-items:center;transition:.2s}
.done .chk{background:var(--c);box-shadow:0 0 14px var(--c)}
.done .t{color:var(--dim);text-decoration:line-through}.done .ic{opacity:.5}
.x{background:none;border:0;color:#6d70a0;font-size:20px;cursor:pointer;padding:2px 6px}
.x:hover{color:var(--rose)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--gold);font-weight:600;padding:12px 0 4px;list-style:none}
summary::-webkit-details-marker{display:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
.form input,.form .btn{grid-column:1/-1}
.btn{background:linear-gradient(135deg,#5a67ff,#9b7bff 55%,#e06bd0);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(120,90,255,.4)}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.35;box-shadow:none}
.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--text);border-radius:99px;padding:7px 13px;font-size:13px;cursor:pointer}
.chip:disabled{opacity:.3}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.timer{text-align:center;padding:34px 20px}
.tm{font:300 66px/1 Sora;color:#fff;margin:18px 0 6px;text-shadow:0 0 30px rgba(155,123,255,.7)}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.seg button{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:8px 14px;cursor:pointer}
.seg button.on{color:#fff;border-color:var(--violet);background:rgba(155,123,255,.28)}
svg.radar{width:100%;max-width:260px;display:block;margin:0 auto 10px}
.st{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 0}
.st .b{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.st .b i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c);border-radius:9px}
.st b{color:var(--c);min-width:22px;text-align:right}
.plus{width:28px;height:28px;border-radius:9px;border:0;background:var(--c);color:#0a0b1e;font-weight:700;cursor:pointer}
.hist{display:flex;gap:4px}
.hist i{flex:1;height:26px;border-radius:7px;background:rgba(255,255,255,.07)}
.hist i.p{background:rgba(155,123,255,.45)}
.hist i.on{background:linear-gradient(180deg,#38d5ff,#9b7bff)}
.a{display:flex;gap:12px;align-items:center;opacity:.35;margin-bottom:10px}
.a.on{opacity:1}
.a i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,210,122,.16);font-style:normal}
.a b{display:block;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.gold{font:700 38px Sora;color:var(--gold);text-shadow:0 0 24px rgba(255,210,122,.5)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.rw:last-of-type{border:0}
.warn{color:#ffb3c4;font-size:13px;margin-top:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(9,10,31,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:130px;background:none;border:0;color:var(--dim);padding:8px 4px;border-radius:14px;cursor:pointer;font-weight:600;font-size:12px;display:grid;gap:2px}
nav button span{font-size:12px}
nav button.on{color:#fff;background:rgba(155,123,255,.25)}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,5,22,.82);z-index:20;padding:24px}
.modal.on{display:grid}
.modal .card{text-align:center;max-width:340px;width:100%;padding:30px;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.big{font:700 26px/1.2 Sora;margin:6px 0 8px;background:linear-gradient(90deg,#38d5ff,#cdbfff,#ff8fd0);-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#241f66;border:1px solid var(--violet);padding:10px 18px;border-radius:99px;font-size:13px;color:#fff;transition:.3s;z-index:21;white-space:nowrap;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.i{display:inline-block;vertical-align:-4px;flex:none}
.ic{color:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px}
.chip .i{color:var(--c)}
.st span .i{color:var(--c)}
.a i{color:var(--gold)}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#6a4bff;top:-90px;left:-80px}
.aurora i:nth-child(2){background:#ff4fa3;top:38%;right:-120px;animation-duration:28s;animation-delay:-8s}
.aurora i:nth-child(3){background:#27c8ff;bottom:-110px;left:12%;animation-duration:32s;animation-delay:-14s}
@keyframes drift{to{transform:translate(70px,90px) scale(1.25)}}
main{position:relative;z-index:1}
nav{z-index:5}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.ft{position:fixed;font:700 16px Sora;pointer-events:none;z-index:41;text-shadow:0 0 14px currentColor;animation:rise 1.1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes rise{to{transform:translate(-50%,-190%);opacity:0}}
.flash{position:fixed;inset:0;z-index:39;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),rgba(155,123,255,.25) 40%,transparent 70%);animation:fl .9s ease-out forwards}
@keyframes fl{to{opacity:0}}
.shake{animation:shk .45s}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.bar i{position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 2.8s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
.ringw svg{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 22px rgba(190,150,255,.95))}}
.big{background-size:200% 100%;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.12) 85%,transparent);animation:spin 9s linear infinite;pointer-events:none}
.hero>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.chk:active{transform:scale(.85)}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div><canvas id="fx"></canvas>
<main id="app"></main>
<nav id="nav"></nav>
<div class="modal" id="modal"><div class="card"><div class="dim small">Система</div><div class="big" id="mT"></div><p class="dim" id="mX" style="margin-bottom:20px"></p><button class="btn" onclick="document.getElementById('modal').classList.remove('on')">Продолжить</button></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='solo-system-v4';
const STATS={str:'Сила',agi:'Ловкость',vit:'Живучесть',int:'Интеллект',sns:'Концентрация'};
const COL={str:'#ff6b8a',agi:'#38d5ff',vit:'#3ee0a0',int:'#7b93ff',sns:'#ffb454'};
const SK=Object.keys(STATS),BODY=['str','agi','vit'];
const RANKS=['Новичок','Охотник','Искатель','Воин','Элита','Монарх'];
const BOSSES=['Гоблин-страж','Каменный голем','Теневой волк','Король теней','Ледяной дракон','Демон врат','Император тьмы'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const dow=()=>(new Date().getDay()+6)%7;
const monday=()=>{const d=new Date();d.setDate(d.getDate()-dow());return ymd(d)};
const need=l=>100+(l-1)*50;
const tier=l=>l<5?0:l<10?1:l<20?2:l<30?3:l<45?4:5;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const QUOTES=['Вчерашний ты — твой единственный соперник.','Система даёт задания. Силу создаёшь ты сам.','Один подход сегодня лучше идеального плана на завтра.','Дисциплина — это делать, даже когда не хочется.','Ты не обязан быть лучшим. Ты обязан быть лучше, чем вчера.','Маленькие задания каждый день превращаются в другого человека.'];
const CATALOG=[
 ['50 отжиманий','str',25],['100 приседаний','str',25],['Планка 2 минуты','str',20],['Подтягивания','str',35],
 ['Пробежка 5 км','agi',35],['Растяжка 10 минут','agi',15],['10 000 шагов','agi',30],
 ['2 литра воды','vit',15],['Сон до 23:00','vit',25],['Без сладкого','vit',30],['Холодный душ','vit',20],
 ['30 минут чтения','int',25],['10 новых слов','int',25],['Урок курса','int',30],
 ['Глубокая работа 25 минут','sns',30],['Медитация 10 минут','sns',20],['День без соцсетей','sns',40],['План на завтра','sns',15]
];
const DEFAULT=[0,4,7,11,12,14];
const ACH=[['first','Первый шаг','Выполни первое задание',()=>S.total>=1],['s3','Три дня подряд','Серия 3 дня',()=>S.streak>=3],['s7','Неделя силы','Серия 7 дней',()=>S.streak>=7],['t50','Полсотни','50 выполненных заданий',()=>S.total>=50],['f5','Монах','5 сессий фокуса',()=>S.focus>=5],['l5','Ранг D','Достигни уровня 5',()=>S.level>=5],['b1','Убийца боссов','Победи первого босса',()=>S.bosses>=1]];
const DUR=[[15,20],[25,35],[45,60]];

// ---------- Иконки (SVG, берут цвет текста) ----------
const IC={
 str:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
 agi:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
 vit:'<path d="M12 21s-7-4.5-9.3-9A5.3 5.3 0 0 1 12 6.3 5.3 5.3 0 0 1 21.3 12C19 16.5 12 21 12 21z"/>',
 int:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5v16M8.5 7.5h7"/>',
 sns:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',
 flame:'<path d="M12 22c4 0 7-2.8 7-7 0-3-2-5-3.5-7-.3 2-1.4 3-2.5 3 0-3-1.5-6-4-8 0 4-4.5 6-4.5 12 0 4.3 3 7 7.5 7z"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 0 1 0 3.5h-3a1.8 1.8 0 0 0 0 3.5h4"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
 skull:'<path d="M12 3a8 8 0 0 0-8 8c0 2.6 1.2 4.4 3 5.5V20h10v-3.5c1.8-1.1 3-2.9 3-5.5a8 8 0 0 0-8-8zM9 12h.01M15 12h.01M10.5 20v-2.5M13.5 20v-2.5"/>',
 trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5c0 3 1.5 4.5 3.5 5M16 6h3.5c0 3-1.5 4.5-3.5 5M12 13v4M8.5 20h7M10 17h4"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
 timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2h5"/>',
 gift:'<path d="M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9C9.500 9 8 8 8 6.500S9.500 4 12 9zM12 9c2.500 0 4-1 4-2.500S14.500 4 12 9z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.600-7 8-7s8 3 8 7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>'
};
const ic=(n,s=20)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

// ---------- Спецэффекты: частицы, конфетти, всплывающий текст, вспышка ----------
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('fx'),g2=cv.getContext('2d');
let P=[],raf=0,shakeBoss=false;
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;g2.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function burst(x,y,color,n=20){
  if(REDUCE)return;
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=2+Math.random()*4;
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:1,d:.016+Math.random()*.014,r:2+Math.random()*3,c:color,g:.12})}
  run();
}
function confetti(){
  if(REDUCE)return;
  const cols=['#38d5ff','#9b7bff','#ff6bb5','#ffd27a','#3ee0a0'];
  for(let i=0;i<110;i++)P.push({x:Math.random()*innerWidth,y:-10-Math.random()*120,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,life:1,d:.007+Math.random()*.006,r:3+Math.random()*4,c:cols[i%5],g:.05,sq:1,rot:Math.random()*6});
  run();
}
function run(){if(!raf)raf=requestAnimationFrame(step)}
function step(){
  g2.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.life>0&&p.y<innerHeight+20);
  for(const p of P){
    p.vx*=.99;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life-=p.d;
    g2.globalAlpha=Math.max(0,p.life);g2.fillStyle=p.c;
    if(p.sq){g2.save();g2.translate(p.x,p.y);g2.rotate(p.rot+=.1);g2.fillRect(-p.r,-p.r/2,p.r*2,p.r);g2.restore()}
    else{g2.shadowColor=p.c;g2.shadowBlur=10;g2.beginPath();g2.arc(p.x,p.y,p.r,0,6.283);g2.fill();g2.shadowBlur=0}
  }
  g2.globalAlpha=1;
  raf=P.length?requestAnimationFrame(step):0;
  if(!P.length)g2.clearRect(0,0,innerWidth,innerHeight);
}
function floatText(x,y,t,c){const e=document.createElement('div');e.className='ft';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';e.style.color=c;document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
function flash(){if(REDUCE)return;const e=document.createElement('div');e.className='flash';document.body.appendChild(e);setTimeout(()=>e.remove(),950)}


const newBoss=()=>{const mx=300+S0lvl()*20;return{wk:monday(),name:BOSSES[Math.floor(Date.now()/6048e5)%BOSSES.length],hp:mx,max:mx,dead:0}};
let S0=null;const S0lvl=()=>S0?S0.level:1;
const fresh=()=>({name:'Игрок',goal:'',level:1,xp:0,streak:0,total:0,focus:0,gold:0,pts:0,bosses:0,ach:{},timer:null,date:today(),allDone:false,hist:{},boss:null,
 rewards:[{id:1,t:'Серия любимого сериала',c:60},{id:2,t:'Любимый десерт',c:100},{id:3,t:'Час игр без чувства вины',c:80}],
 stats:{str:1,agi:1,vit:1,int:1,sns:1},
 quests:DEFAULT.map((i,n)=>({id:n+1,title:CATALOG[i][0],stat:CATALOG[i][1],xp:CATALOG[i][2],done:false}))});
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('solo-system-v3')||localStorage.getItem('solo-system-v2'))||{}}catch(e){S={}}
S={...fresh(),...S};S.stats={...fresh().stats,...S.stats};S0=S;
let penalty=false,tab='today',addOpen=false,tdur=1;
if(S.date!==today()){if(!S.allDone){S.streak=0;penalty=true}S.quests.forEach(q=>q.done=false);S.allDone=false;S.date=today()}
if(!S.boss||S.boss.wk!==monday())S.boss=newBoss();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2300)}
function modal(t,x){document.getElementById('mT').textContent=t;document.getElementById('mX').textContent=x;document.getElementById('modal').classList.add('on')}
function addXp(n){let ups=0;S.xp+=n;while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;ups++}
  if(ups){confetti();flash();S.pts+=3*ups;modal('Уровень '+S.level,RANKS[tier(S.level)]+' · +'+3*ups+' очка характеристик (вкладка «Профиль»)')}}
function hit(n){const b=S.boss;if(b.dead)return;b.hp-=n;shakeBoss=true;if(b.hp<=0){b.hp=0;b.dead=1;S.gold+=120;S.bosses++;confetti();flash();setTimeout(()=>modal('Босс повержен','«'+b.name+'» побеждён · +120 монет'),700)}}
function ach(){ACH.forEach(a=>{if(!S.ach[a[0]]&&a[3]()){S.ach[a[0]]=1;setTimeout(()=>toast('Достижение: '+a[1]),1100)}})}
function mark(){const d=S.quests.filter(q=>q.done).length;S.hist[today()]=S.quests.length?d/S.quests.length:0}
const gl=q=>Math.ceil(q.xp/5);

function toggle(id,ev){
  const q=S.quests.find(q=>q.id===id);if(!q)return;
  if(!q.done){
    q.done=true;const px=ev?ev.clientX:innerWidth/2,py=ev?ev.clientY:300;burst(px,py,COL[q.stat],22);floatText(px,py-10,'+'+q.xp+' XP',COL[q.stat]);if(navigator.vibrate)navigator.vibrate(25);S.total++;S.stats[q.stat]++;S.gold+=gl(q);addXp(q.xp);hit(q.xp);toast('+'+q.xp+' XP · +'+gl(q)+' мон.');mark();
    if(S.quests.every(q=>q.done)&&!S.allDone){S.allDone=true;S.streak++;S.gold+=25;setTimeout(()=>{addXp(50);confetti();toast('Все задания · +50 XP и +25 монет');ach();save();render()},800)}
  }else if(!S.allDone){
    q.done=false;S.total=Math.max(0,S.total-1);S.stats[q.stat]=Math.max(1,S.stats[q.stat]-1);S.gold=Math.max(0,S.gold-gl(q));S.xp=Math.max(0,S.xp-q.xp);if(!S.boss.dead)S.boss.hp=Math.min(S.boss.max,S.boss.hp+q.xp);mark();
  }
  ach();save();render();
}
function addQ(e){e.preventDefault();const t=document.getElementById('qn').value.trim();if(!t)return;
  S.quests.push({id:Date.now(),title:t,stat:document.getElementById('qs').value,xp:+document.getElementById('qx').value,done:false});S.allDone=false;mark();save();render();toast('Задание создано')}
function addCat(i){const c=CATALOG[i];S.quests.push({id:Date.now(),title:c[0],stat:c[1],xp:c[2],done:false});S.allDone=false;mark();save();render()}
function removeQ(id){S.quests=S.quests.filter(q=>q.id!==id);mark();save();render()}
function addR(e){e.preventDefault();const t=document.getElementById('rn').value.trim(),c=+document.getElementById('rc').value;if(!t||!c)return;S.rewards.push({id:Date.now(),t,c});save();render()}
function buy(id){const r=S.rewards.find(r=>r.id===id);if(!r||S.gold<r.c)return;S.gold-=r.c;save();render();toast('Награда получена: '+r.t)}
function delR(id){S.rewards=S.rewards.filter(r=>r.id!==id);save();render()}
function spend(k){if(S.pts<1)return;S.pts--;S.stats[k]++;save();render()}

const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function startT(){S.timer={end:Date.now()+DUR[tdur][0]*60000,len:DUR[tdur][0]*60000,xp:DUR[tdur][1]};save();render()}
function stopT(){S.timer=null;save();render()}
function tick(){if(!S.timer)return;const left=S.timer.end-Date.now();
  if(left<=0){const x=S.timer.xp;S.timer=null;S.focus++;S.stats.sns++;S.gold+=10;addXp(x);hit(x);confetti();toast('Фокус завершён · +'+x+' XP · +10 монет');if(navigator.vibrate)navigator.vibrate(300);ach();save();render();return}
  const el=document.getElementById('tm'),b=document.getElementById('tb');if(el)el.textContent=fmt(left);if(b)b.style.width=(100-left/S.timer.len*100)+'%'}
setInterval(tick,500);

function exportD(){const j=JSON.stringify(S);if(navigator.clipboard)navigator.clipboard.writeText(j).then(()=>toast('Скопировано в буфер'),()=>prompt('Скопируй:',j));else prompt('Скопируй:',j)}
function importD(){const j=prompt('Вставь сохранённые данные');if(!j)return;try{const d=JSON.parse(j);if(!Array.isArray(d.quests))throw 0;S={...fresh(),...d};save();render();toast('Данные загружены')}catch(e){toast('Не удалось прочитать данные')}}
function resetAll(){if(confirm('Удалить весь прогресс и начать заново?')){S=fresh();S0=S;S.boss=newBoss();penalty=false;save();render()}}
function setTab(t){tab=t;render();scrollTo(0,0)}

function radar(){
  const cx=110,cy=110,r=76,max=Math.max(10,...SK.map(k=>S.stats[k]));
  const pt=(i,v)=>{const a=(-90+72*i)*Math.PI/180;return[cx+Math.cos(a)*r*v,cy+Math.sin(a)*r*v]};
  const ring=v=>SK.map((_,i)=>pt(i,v).join(',')).join(' ');
  const data=SK.map((k,i)=>pt(i,S.stats[k]/max).join(',')).join(' ');
  const lab=SK.map((k,i)=>{const[x,y]=pt(i,1.34);return`<text x="${x}" y="${y}" fill="${COL[k]}" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="Sora">${STATS[k]}</text>`}).join('');
  const dots=SK.map((k,i)=>{const[x,y]=pt(i,S.stats[k]/max);return`<circle cx="${x}" cy="${y}" r="3.5" fill="${COL[k]}"/>`}).join('');
  return`<svg class="radar" viewBox="0 0 220 220" role="img" aria-label="Характеристики"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38d5ff" stop-opacity=".5"/><stop offset="1" stop-color="#ff6bb5" stop-opacity=".45"/></linearGradient></defs>${[.5,1].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="rgba(170,160,255,.2)"/>`).join('')}${SK.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" stroke="rgba(170,160,255,.14)"/>`).join('')}<polygon points="${data}" fill="url(#rg)" stroke="#cdbfff" stroke-width="1.6" stroke-linejoin="round"/>${dots}${lab}</svg>`;
}
function qrow(q){return`<div class="q ${q.done?'done':''}" style="--c:${COL[q.stat]}"><div class="ic">${ic(q.stat,20)}</div><div><div class="t">${esc(q.title)}</div><div class="dim small">${STATS[q.stat]} · +${gl(q)} мон. <button class="x" style="font-size:14px;padding:0 4px" onclick="removeQ(${q.id})" aria-label="Удалить">удалить</button></div></div><span class="xp">+${q.xp}</span><button class="chk" onclick="toggle(${q.id},event)" aria-label="Отметить">${q.done?ic('check',16):''}</button></div>`}
function grp(name,list){return list.length?`<div class="grp"><span>${name}</span><span>${list.filter(q=>q.done).length} из ${list.length}</span></div>`+list.map(qrow).join(''):''}
function strip(){let o='';for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=ymd(d),v=S.hist[k]||0;o+=`<i class="${v>=1?'on':v>0?'p':''}" title="${k}"></i>`}return o}

function viewToday(){
  const pct=S.xp/need(S.level)*100,C=2*Math.PI*48,done=S.quests.filter(q=>q.done).length,b=S.boss;
  const have=new Set(S.quests.map(q=>q.title));
  const quote=QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length];
  const chip=(c,i)=>`<button class="chip" style="--c:${COL[c[1]]}" ${have.has(c[0])?'disabled':''} onclick="addCat(${i})">${ic(c[1],16)} ${c[0]}</button>`;
  return`
  <section class="card hero"><div class="hr">
    <div class="ringw"><svg viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38d5ff"/><stop offset=".6" stop-color="#cdbfff"/><stop offset="1" stop-color="#ff8fd0"/></linearGradient></defs><circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/><circle cx="60" cy="60" r="48" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 60 60)"/></svg><div><b>${'EDCBAS'[tier(S.level)]}</b><span>Ур. ${S.level}</span></div></div>
    <div style="flex:1;min-width:0"><input class="nm" id="nm" value="${esc(S.name)}" maxlength="18" aria-label="Имя"><div class="small dim">${RANKS[tier(S.level)]}</div>
    <div class="bar"><i style="width:${pct}%"></i></div><div class="xpl"><span>${S.xp} / ${need(S.level)} XP</span><span>до уровня ${need(S.level)-S.xp}</span></div></div></div>
    <div class="pills"><span class="pill">${ic('flame',16)} ${S.streak} дн.</span><span class="pill">${ic('coin',16)} ${S.gold}</span><span class="pill">${ic('star',16)} ${S.pts} очков</span><span class="pill">${ic('check',16)} ${done}/${S.quests.length}</span></div>
    <input class="goal" id="goal" value="${esc(S.goal)}" maxlength="90" placeholder="Моя главная цель: зачем я это делаю?" aria-label="Цель">
    ${penalty?'<p class="warn">Вчера задания не выполнены, серия сброшена. Начни заново сегодня.</p>':''}
  </section>
  <p class="quote">${quote}</p>
  <section class="card" id="boss"><div class="bt"><span>${ic('skull',20)} Босс недели: ${b.name}</span><span class="dim small">${b.dead?'побеждён':(7-dow())+' дн.'}</span></div>
    <div class="bar red"><i style="width:${b.hp/b.max*100}%"></i></div>
    <div class="xpl dim"><span>${b.hp} / ${b.max} HP</span><span>${b.dead?'новый босс в понедельник':'каждое задание — удар'}</span></div></section>
  <section class="card"><h2>Задания на сегодня</h2>
    ${S.quests.length?grp('Тело',S.quests.filter(q=>BODY.includes(q.stat)))+grp('Мозг',S.quests.filter(q=>!BODY.includes(q.stat))):'<p class="dim">Заданий нет. Добавь первое ниже.</p>'}
    <details ${addOpen?'open':''} ontoggle="addOpen=this.open"><summary>${ic('plus',16)} Добавить задание</summary>
      <form class="form" onsubmit="addQ(event)">
        <input id="qn" placeholder="Своё задание, например: 20 минут гитары" required maxlength="60">
        <select id="qs" aria-label="Категория"><optgroup label="Тело">${BODY.map(k=>`<option value="${k}">${STATS[k]}</option>`).join('')}</optgroup><optgroup label="Мозг"><option value="int">Интеллект</option><option value="sns">Концентрация</option></optgroup></select>
        <select id="qx" aria-label="Сложность"><option value="15">Легко · 15 XP</option><option value="30" selected>Средне · 30 XP</option><option value="50">Тяжело · 50 XP</option></select>
        <button class="btn" type="submit">Создать</button>
      </form>
      <h2>Для тела</h2><div class="chips">${CATALOG.map((c,i)=>BODY.includes(c[1])?chip(c,i):'').join('')}</div>
      <h2>Для мозга</h2><div class="chips">${CATALOG.map((c,i)=>!BODY.includes(c[1])?chip(c,i):'').join('')}</div>
    </details>
  </section>`;
}
function viewFocus(){const t=S.timer;
  return`<section class="card timer"><h2>Фокус</h2><p class="dim small">Убери телефон и работай без отвлечений. За сессию: XP, +1 к концентрации, 10 монет и удар по боссу.</p>
  <div class="tm" id="tm">${t?fmt(t.end-Date.now()):DUR[tdur][0]+':00'}</div>
  <div class="bar" style="margin:0 auto 26px;max-width:240px"><i id="tb" style="width:${t?100-(t.end-Date.now())/t.len*100:0}%"></i></div>
  ${t?`<button class="ghost" onclick="stopT()">Отменить</button>`:`<div class="seg">${DUR.map((d,i)=>`<button class="${i===tdur?'on':''}" onclick="tdur=${i};render()">${d[0]} мин · ${d[1]} XP</button>`).join('')}</div><button class="btn" onclick="startT()" style="padding:13px 44px">Начать</button>`}
  <p class="dim small" style="margin-top:22px">Сессий завершено: ${S.focus}</p></section>`;
}
function viewShop(){
  return`<section class="card" style="text-align:center"><div class="dim small">Твои монеты</div><div class="gold">${ic('coin',34)} ${S.gold}</div><p class="dim small">Монеты даются за задания, фокус и боссов. Трать их на награды, которые придумаешь сам.</p></section>
  <section class="card"><h2>Награды</h2>
  ${S.rewards.map(r=>`<div class="rw"><div><div class="t">${esc(r.t)}</div><button class="x" style="font-size:13px;padding:0" onclick="delR(${r.id})">удалить</button></div><button class="btn" ${S.gold<r.c?'disabled':''} onclick="buy(${r.id})">${ic('coin',16)} ${r.c}</button></div>`).join('')||'<p class="dim">Наград нет. Добавь первую.</p>'}
  <form class="form" onsubmit="addR(event)" style="margin-top:16px"><input id="rn" placeholder="Новая награда, например: поход в кино" required maxlength="50"><input id="rc" type="number" min="5" max="9999" placeholder="Цена в монетах" required style="grid-column:1/-1"><button class="btn" type="submit">Добавить награду</button></form></section>`;
}
function viewProfile(){
  const max=Math.max(10,...SK.map(k=>S.stats[k]));
  return`<section class="card"><h2>Характеристики</h2>${radar()}
  <p class="dim small" style="text-align:center;margin-bottom:6px">Свободных очков: <b style="color:var(--gold)">${S.pts}</b> (по 3 за уровень)</p>
  ${SK.map(k=>`<div class="st" style="--c:${COL[k]}"><span>${ic(k,18)} ${STATS[k]}</span><div class="b"><i style="width:${S.stats[k]/max*100}%"></i></div><b>${S.stats[k]}</b>${S.pts?`<button class="plus" onclick="spend('${k}')" aria-label="Добавить очко">+</button>`:'<span></span>'}</div>`).join('')}</section>
  <section class="card"><h2>Последние 14 дней</h2><div class="hist">${strip()}</div><p class="dim small" style="margin-top:10px">Яркий день — все задания выполнены. Всего заданий: ${S.total}. Боссов побеждено: ${S.bosses}.</p></section>
  <section class="card"><h2>Достижения</h2>${ACH.map(a=>`<div class="a ${S.ach[a[0]]?'on':''}"><i>${ic('trophy',20)}</i><div><b>${a[1]}</b><span class="dim small">${a[2]}</span></div></div>`).join('')}</section>
  <section class="card"><h2>Данные</h2><p class="dim small" style="margin-bottom:12px">Прогресс хранится в этом браузере. Скопируй его, чтобы перенести на другое устройство.</p>
  <div class="row"><button class="ghost" onclick="exportD()">Скопировать</button><button class="ghost" onclick="importD()">Загрузить</button><button class="ghost" onclick="resetAll()" style="color:var(--rose)">Сбросить</button></div></section>`;
}
function render(){
  document.getElementById('app').innerHTML={today:viewToday,focus:viewFocus,shop:viewShop,me:viewProfile}[tab]();
  document.getElementById('nav').innerHTML=[['today','list','Сегодня'],['focus','timer','Фокус'],['shop','gift','Награды'],['me','user','Профиль']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${ic(t[1],22)}<span>${t[2]}</span></button>`).join('');
  const nm=document.getElementById('nm'),g=document.getElementById('goal');
  if(nm)nm.onchange=e=>{S.name=e.target.value.trim()||'Игрок';save()};
  if(g)g.onchange=e=>{S.goal=e.target.value.trim();save()};
  const bs=document.getElementById('boss');if(bs&&shakeBoss)bs.classList.add('shake');shakeBoss=false;
}
ach();save();render();
if(penalty)toast('Серия сброшена');
tick();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
